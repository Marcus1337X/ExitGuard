name: CI & Build Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Prepare Official Release Keystore (Private Repo Only)
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "has_official_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Official Release APK (Private Repo)
        if: steps.keystore.outputs.has_official_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ExitGuard-official-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload CI Verification APK (Public Repo - Debug Signed)
        if: steps.keystore.outputs.has_official_keystore != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ExitGuard-ci-verification-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
